<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cityscoutAI - Sioux Falls Events</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            font-size: 1.1em;
        }

        .controls {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #5568d3;
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            color: #667eea;
            font-weight: 600;
            margin-left: auto;
        }

        .stat {
            background: #f0f0f0;
            padding: 10px 15px;
            border-radius: 8px;
            color: #333;
        }

        .events-table {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #667eea;
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            white-space: nowrap;
        }

        th:hover {
            background: #5568d3;
        }

        th.sortable::after {
            content: ' ↕';
            font-size: 0.8em;
            opacity: 0.6;
        }

        th.sorted-asc::after {
            content: ' ↑';
            opacity: 1;
        }

        th.sorted-desc::after {
            content: ' ↓';
            opacity: 1;
        }

        tbody tr {
            border-bottom: 1px solid #e0e0e0;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: #f9f9f9;
        }

        td {
            padding: 15px;
            color: #333;
            font-size: 0.95em;
        }

        .event-title-col {
            font-weight: 600;
            max-width: 300px;
            word-wrap: break-word;
        }

        .event-location-col {
            color: #667eea;
            font-weight: 500;
            max-width: 200px;
            word-wrap: break-word;
        }

        .event-date-col {
            white-space: nowrap;
            font-weight: 500;
        }

        .event-time-col {
            white-space: nowrap;
        }

        .event-link-col a {
            color: #667eea;
            text-decoration: none;
            font-size: 0.85em;
        }

        .event-link-col a:hover {
            text-decoration: underline;
        }

        .event-id-col {
            font-family: 'Courier New', monospace;
            font-size: 0.75em;
            color: #999;
            max-width: 120px;
            word-break: break-all;
            padding: 10px 8px;
        }

        .tag {
            background: #f0f0f0;
            color: #667eea;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: 500;
            display: inline-block;
            margin-right: 5px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            padding: 40px;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .no-results {
            background: white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: #999;
            font-size: 1.1em;
        }

        .detail-row {
            color: #667eea;
            text-decoration: none;
            font-size: 0.85em;
            word-break: break-all;
        }

        .event-url:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px;
            font-size: 0.9em;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .stats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎉 cityscoutAI Events</h1>
            <p class="subtitle">Discover events in Sioux Falls</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search events (e.g., brewery, wine, concert)...">
            </div>
            <button onclick="searchEvents()">Search</button>
            <button onclick="clearSearch()">Clear</button>
            <div class="stats">
                <div class="stat">📊 <span id="totalCount">0</span> Total</div>
                <div class="stat">🔍 <span id="displayCount">0</span> Showing</div>
            </div>
        </div>

        <div id="errorContainer"></div>

        <div id="loadingContainer" class="loading" style="display: none;">
            Loading events...
        </div>

        <div id="eventsContainer" class="events-table">
            <table id="eventsTable">
                <thead>
                    <tr>
                        <th class="sortable" onclick="sortTable('date')">📅 Date</th>
                        <th class="sortable" onclick="sortTable('start_time')">⏰ Time</th>
                        <th class="sortable" onclick="sortTable('title')">🎉 Event</th>
                        <th class="sortable" onclick="sortTable('location')">📍 Location</th>
                        <th>🔗 Source</th>
                        <th>ID</th>
                    </tr>
                </thead>
                <tbody id="eventsTableBody">
                </tbody>
            </table>
        </div>

        <div id="noResults" class="no-results" style="display: none;">No events found. Try a different search.</div>

        <footer>
            <p>cityscoutAI - Local Event Discovery Platform | Powered by Scrapy, Elasticsearch & FastAPI</p>
        </footer>
    </div>

    <script>
        let allEvents = [];
        let currentSort = { field: 'date', direction: 'asc' };
        const API_BASE = 'http://localhost:8000/api';

        // Load events on page load
        window.addEventListener('DOMContentLoaded', loadEvents);

        // Search on Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchEvents();
            }
        });

        async function loadEvents() {
            const loadingContainer = document.getElementById('loadingContainer');
            const errorContainer = document.getElementById('errorContainer');
            loadingContainer.style.display = 'block';
            errorContainer.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/events/?limit=100`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                allEvents = await response.json();
                console.log('Loaded events array:', allEvents.length);
                // Update total count BEFORE sorting
                const totalCountEl = document.getElementById('totalCount');
                console.log('totalCountEl found:', !!totalCountEl);
                if (totalCountEl) {
                    console.log('Setting totalCount to:', allEvents.length);
                    totalCountEl.textContent = allEvents.length;
                    console.log('totalCountEl.textContent now:', totalCountEl.textContent);
                }
                // Sort by date by default
                currentSort = { field: 'date', direction: 'asc' };
                sortedDisplay(allEvents);
                updateSortIndicator('date');
            } catch (error) {
                console.error('Error loading events:', error);
                errorContainer.innerHTML = `<div class="error">Error loading events: ${error.message}</div>`;
            } finally {
                loadingContainer.style.display = 'none';
            }
        }

        function parseDate(dateStr) {
            // Try to parse various date formats
            const date = new Date(dateStr);
            if (!isNaN(date)) return date;
            
            // Try parsing "Monday December 15th" format
            const cleaned = dateStr.replace(/\b(st|nd|rd|th)\b/g, '').trim();
            const date2 = new Date(cleaned);
            if (!isNaN(date2)) return date2;
            
            return new Date(0);
        }

        function formatDateForDisplay(dateStr) {
            // Takes YYYY-MM-DD format and returns "Weekday, MM/DD/YYYY"
            if (!dateStr) return '—';
            
            try {
                const [year, month, day] = dateStr.split('-');
                const date = new Date(year, parseInt(month) - 1, day);
                
                if (isNaN(date.getTime())) {
                    return dateStr; // Fallback to original if parsing fails
                }
                
                const weekdays = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
                const weekday = weekdays[date.getDay()];
                const monthNum = String(date.getMonth() + 1).padStart(2, '0');
                const dayNum = String(date.getDate()).padStart(2, '0');
                const yearNum = date.getFullYear();
                
                return `${weekday}, ${monthNum}/${dayNum}/${yearNum}`;
            } catch (e) {
                return dateStr; // Fallback to original
            }
        }

        function sortTable(field) {
            // Toggle direction if same field, otherwise set to asc
            if (currentSort.field === field) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.field = field;
                currentSort.direction = 'asc';
            }

            const query = document.getElementById('searchInput').value.toLowerCase();
            let eventsToSort = allEvents;
            
            if (query) {
                eventsToSort = allEvents.filter(event => {
                    const searchableText = `
                        ${event.title}
                        ${event.description}
                        ${event.location}
                        ${event.organizer}
                        ${event.tags.join(' ')}
                    `.toLowerCase();
                    return searchableText.includes(query);
                });
            }

            eventsToSort.sort((a, b) => {
                let aVal = a[field] || '';
                let bVal = b[field] || '';

                // Special handling for dates
                if (field === 'date') {
                    aVal = parseDate(aVal);
                    bVal = parseDate(bVal);
                } else if (field === 'start_time') {
                    // Parse time format HH:MM am/pm
                    aVal = parseTime(aVal);
                    bVal = parseTime(bVal);
                } else {
                    // String comparison
                    aVal = String(aVal).toLowerCase();
                    bVal = String(bVal).toLowerCase();
                }

                if (aVal < bVal) return currentSort.direction === 'asc' ? -1 : 1;
                if (aVal > bVal) return currentSort.direction === 'asc' ? 1 : -1;
                return 0;
            });

            updateSortIndicator(field);
            sortedDisplay(eventsToSort);
        }

        function parseTime(timeStr) {
            if (!timeStr) return '00:00';
            // Extract HH:MM from formats like "7:00 pm" or "19:00"
            const match = timeStr.match(/(\d{1,2}):(\d{2})/);
            if (!match) return '00:00';
            
            let hours = parseInt(match[1]);
            const minutes = match[2];
            
            // Handle 12-hour format
            if (timeStr.includes('pm') && hours !== 12) {
                hours += 12;
            } else if (timeStr.includes('am') && hours === 12) {
                hours = 0;
            }
            
            return String(hours).padStart(2, '0') + ':' + minutes;
        }

        function updateSortIndicator(field) {
            // Remove all sort indicators
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sorted-asc', 'sorted-desc');
            });

            // Add sort indicator to current sort field
            const ths = document.querySelectorAll('th');
            ths.forEach(th => {
                if (th.textContent.includes(field.charAt(0).toUpperCase())) {
                    th.classList.add(currentSort.direction === 'asc' ? 'sorted-asc' : 'sorted-desc');
                }
            });
        }

        function searchEvents() {
            sortTable(currentSort.field);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            sortTable(currentSort.field);
        }

        function sortedDisplay(events) {
            const container = document.getElementById('eventsTableBody');
            const noResults = document.getElementById('noResults');
            // Only update display count, not total count
            const displayCountEl = document.getElementById('displayCount');
            if (displayCountEl) {
                displayCountEl.textContent = events.length;
            }

            if (events.length === 0) {
                container.innerHTML = '';
                noResults.style.display = 'block';
                document.getElementById('eventsContainer').style.display = 'none';
                return;
            }

            noResults.style.display = 'none';
            document.getElementById('eventsContainer').style.display = 'block';

            container.innerHTML = events.map(event => `
                <tr>
                    <td class="event-date-col">${formatDateForDisplay(event.date)}</td>
                    <td class="event-time-col">${escapeHtml(event.start_time || '—')}${event.end_time ? ` - ${escapeHtml(event.end_time)}` : ''}</td>
                    <td class="event-title-col">${escapeHtml(event.title)}</td>
                    <td class="event-location-col">${escapeHtml(event.location)}</td>
                    <td class="event-link-col">${event.link ? `<a href="${escapeHtml(event.link)}" target="_blank" title="${escapeHtml(event.url)}">View →</a>` : '—'}</td>
                    <td class="event-id-col" title="${escapeHtml(event.event_id || '')}">${escapeHtml((event.event_id || '').substring(0, 12))}</td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
